[workspace]
resolver = "2"
members = ["crates/dpm", "crates/dpm-server", "crates/dpm-core"]

[workspace.package]
version = "0.1.5"
edition = "2021"
authors = ["Derrick Lin"]
license = "MIT OR Apache-2.0"
# Workspace 之後可能整個搬到別的 GitHub 帳號/repo,所以來源網址只在這裡定義一次,
# 三個 crate 的 Cargo.toml 都用 repository.workspace = true 繼承,不要各自硬編。
repository = "https://github.com/Derrick-Program/DPM-Workspace"

[workspace.dependencies]
DPM-Core = { path = "crates/dpm-core" }
anstyle = "1.0.6"
anyhow = "1.0.94"
clap = { version = "4.5", features = ["cargo", "color", "derive"] }
clap_complete = "4.5"
colored = "3.1.1"
flate2 = "1.0.28"
futures-util = "0.3.31"
reqwest = { version = "0.12.28", features = ["json", "stream"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.8"
tokio = { version = "1.42", features = ["full"] }
turso = "0.6.1"
walkdir = "2.4.0"
zip = "0.6.6"

[profile.release]
lto = true
strip = true
