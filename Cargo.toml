[workspace]
resolver = "2"
members = ["crates/dpm", "crates/dpm-server", "crates/dpm-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Derrick Lin"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
DPM-Core = { path = "crates/dpm-core" }
anstyle = "1.0.6"
anyhow = "1.0.94"
clap = { version = "4.5", features = ["cargo", "color", "derive"] }
clap_complete = "4.5"
colored = "2.1.0"
digest = "0.10.7"
flate2 = "1.0.28"
futures-util = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.12.9", features = ["json", "stream"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
sha2 = "0.10.8"
thiserror = "2.0.8"
tokio = { version = "1.42", features = ["full"] }
walkdir = "2.4.0"
zip = "0.6.6"

[profile.release]
lto = true
strip = true
